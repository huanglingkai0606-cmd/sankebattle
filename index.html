<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #1a1a2e; font-family: Arial, sans-serif;
}
.game-container {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
h1 { color: #e94560; font-size: 2.5rem; text-shadow: 0 0 10px rgba(233,69,96,0.5); }
.score-board { display: flex; gap: 40px; }
.score-item { text-align: center; }
.score-label { color: #888; font-size: 0.9rem; text-transform: uppercase; }
.score-value { color: #fff; font-size: 1.8rem; font-weight: bold; }
canvas { border: 2px solid #e94560; border-radius: 4px; background: #16213e; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  padding: 10px 24px; border: none; border-radius: 6px;
  font-size: 1rem; cursor: pointer; transition: all 0.2s;
}
.btn-start { background: #e94560; color: #fff; }
.btn-start:hover { background: #d63851; }
.btn-pause { background: #0f3460; color: #fff; }
.btn-pause:hover { background: #1a4a7a; }
.mobile-controls { display: none; grid-template: 1fr 1fr / 1fr 1fr 1fr; gap: 8px; width: 200px; }
.mobile-controls button {
  padding: 14px; background: #0f3460; color: #fff;
  border: 1px solid #e94560; border-radius: 8px; font-size: 1.2rem;
}
.mobile-controls button:active { background: #e94560; }
#btn-up { grid-column: 2; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
.game-over-overlay {
  display: none; position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.7);
  justify-content: center; align-items: center; flex-direction: column; gap: 16px;
}
.game-over-overlay.show { display: flex; }
.game-over-overlay h2 { color: #e94560; font-size: 2rem; }
@media (max-width: 600px) {
  .mobile-controls { display: grid; }
  h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="game-container">
  <h1>贪吃蛇</h1>
  <div class="score-board">
    <div class="score-item">
      <div class="score-label">得分</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">最高分</div>
      <div class="score-value" id="highScore">0</div>
    </div>
  </div>
  <div style="position: relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="game-over-overlay" id="gameOverOverlay">
      <h2>游戏结束</h2>
      <p style="color:#fff;font-size:1.2rem;">最终得分: <span id="finalScore">0</span></p>
      <button class="btn-start" onclick="restartGame()">再来一局</button>
    </div>
  </div>
  <div class="controls">
    <button class="btn-start" id="btnStart" onclick="toggleGame()">开始游戏</button>
    <button class="btn-pause" onclick="restartGame()">重新开始</button>
  </div>
  <div class="mobile-controls">
    <button id="btn-up" onclick="setDirection('UP')">▲</button>
    <button id="btn-left" onclick="setDirection('LEFT')">◀</button>
    <button id="btn-down" onclick="setDirection('DOWN')">▼</button>
    <button id="btn-right" onclick="setDirection('RIGHT')">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE;

let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let direction = 'RIGHT';
let nextDirection = 'RIGHT';
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
let gameRunning = false;
let gamePaused = false;
let gameLoop = null;
let speed = 100;

document.getElementById('highScore').textContent = highScore;

function setDirection(dir) {
  const opposites = { UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT' };
  if (opposites[dir] !== direction) nextDirection = dir;
}

function spawnFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; break; }
  }
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= TILE_COUNT; i++) {
    ctx.beginPath(); ctx.moveTo(i * GRID_SIZE, 0); ctx.lineTo(i * GRID_SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * GRID_SIZE); ctx.lineTo(canvas.width, i * GRID_SIZE); ctx.stroke();
  }

  // Draw food
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, GRID_SIZE / 2 - 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Draw snake
  snake.forEach((seg, i) => {
    const alpha = 1 - i / (snake.length + 10);
    ctx.fillStyle = i === 0 ? '#4ecca3' : `rgba(78, 204, 163, ${alpha})`;
    ctx.shadowColor = i === 0 ? '#4ecca3' : 'transparent';
    ctx.shadowBlur = i === 0 ? 8 : 0;
    const pad = 1;
    ctx.fillRect(seg.x * GRID_SIZE + pad, seg.y * GRID_SIZE + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2);
    ctx.shadowBlur = 0;
  });
}

function update() {
  direction = nextDirection;
  const head = {...snake[0]};
  switch (direction) {
    case 'UP': head.y--; break;
    case 'DOWN': head.y++; break;
    case 'LEFT': head.x--; break;
    case 'RIGHT': head.x++; break;
  }

  // Wall collision
  if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
    return gameOver();
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    spawnFood();
    if (speed > 50) { clearInterval(gameLoop); speed -= 2; gameLoop = setInterval(tick, speed); }
  } else {
    snake.pop();
  }
}

function tick() { update(); draw(); }

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
    document.getElementById('highScore').textContent = highScore;
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverOverlay').classList.add('show');
  document.getElementById('btnStart').textContent = '开始游戏';
}

function toggleGame() {
  if (!gameRunning) {
    startGame();
  } else {
    if (gamePaused) {
      gamePaused = false;
      gameLoop = setInterval(tick, speed);
      document.getElementById('btnStart').textContent = '暂停';
    } else {
      gamePaused = true;
      clearInterval(gameLoop);
      document.getElementById('btnStart').textContent = '继续';
    }
  }
}

function startGame() {
  snake = [{x: 10, y: 10}];
  direction = 'RIGHT';
  nextDirection = 'RIGHT';
  score = 0;
  speed = 100;
  document.getElementById('score').textContent = '0';
  document.getElementById('gameOverOverlay').classList.remove('show');
  spawnFood();
  gameRunning = true;
  gamePaused = false;
  document.getElementById('btnStart').textContent = '暂停';
  gameLoop = setInterval(tick, speed);
}

function restartGame() {
  clearInterval(gameLoop);
  startGame();
}

document.addEventListener('keydown', e => {
  const keys = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
                 w: 'UP', W: 'UP', s: 'DOWN', S: 'DOWN', a: 'LEFT', A: 'LEFT', d: 'RIGHT', D: 'RIGHT' };
  if (keys[e.key]) { e.preventDefault(); setDirection(keys[e.key]); }
  if (e.key === ' ' || e.key === 'p') { e.preventDefault(); toggleGame(); }
});

draw();
</script>
</body>
</html>
